<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6e9e3">
  <meta name="description" content="Hitung mundur menuju hari spesial kita.">
  <title>Menuju Hari Kita</title>
  <link rel="stylesheet" href="timer.css">
  <script src="timer.js" defer></script>
</head>
<body>
  <div class="timer-hearts" aria-hidden="true"></div>
  <main class="timer-page">
    <section class="timer-content" aria-labelledby="timer-title">
      <div class="timer-mark" aria-hidden="true">18 <span>oktober</span></div>
      <p class="timer-eyebrow">ADA HARI YANG KITA TUNGGU</p>
      <h1 id="timer-title">Untuk kita,<br><em>pada waktunya.</em></h1>
      <p class="timer-copy">Cerita ini akan terbuka pada 18 Oktober 2026.</p>

      <div class="countdown" role="timer" aria-live="off" aria-label="Hitung mundur menuju 18 Oktober 2026">
        <div><strong id="days">000</strong><span>hari</span></div>
        <div><strong id="hours">00</strong><span>jam</span></div>
        <div><strong id="minutes">00</strong><span>menit</span></div>
        <div><strong id="seconds">00</strong><span>detik</span></div>
      </div>
      <button class="continue-button" id="continue-button" type="button" disabled>Lanjut <span aria-hidden="true">&#8594;</span></button>

      <section class="intro-player" aria-label="Pemutar lagu Intro Depan">
        <div class="album-art" aria-label="Sampul Terbuang Dalam Waktu oleh Barasuara">
          <img id="album-image" alt="Sampul lagu Terbuang Dalam Waktu oleh Barasuara" hidden>
          <span class="album-fallback" aria-hidden="true"><strong>BARASUARA</strong><span>Terbuang<br>Dalam Waktu</span></span>
        </div>
        <div class="intro-meta">
          <span class="intro-label">LAGU PENGANTAR</span>
          <strong>Intro Depan</strong>
          <span class="intro-artist">Untuk hari yang kita tunggu</span>
        </div>
        <div class="intro-controls">
          <button id="play-button" type="button" aria-label="Putar Intro Depan" title="Putar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.8l9.1 6.2a1 1 0 0 1 0 1.6l-9.1 6.2c-.7.5-1.6 0-1.6-.8V5.8Z"/></svg>
          </button>
          <button id="stop-button" type="button" aria-label="Hentikan Intro Depan" title="Stop" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
        <audio id="intro-song" preload="metadata">
          <source src="intro%20depan.mpeg" type="audio/mpeg">
        </audio>
      </section>
      <p class="timer-footnote">DENGARKAN SAMBIL MENUNGGU</p>
    </section>
  </main>
</body>
</html>
